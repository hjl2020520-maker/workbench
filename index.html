<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#9b7edc">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="cover.jpg">
<link rel="icon" href="cover.jpg">
<link rel="manifest" href="manifest.json">
<title>工作台</title>
<link rel="stylesheet" href="style.css?v=2026073023">
</head>
<body>

<!-- 启动封面 -->
<div class="splash-screen" id="splashScreen">
  <div class="splash-bg"></div>
  <div class="splash-content">
    <div class="splash-image-wrap">
      <img src="cover.jpg" alt="cover" class="splash-image">
      <div class="splash-sparkle s1">✨</div><div class="splash-sparkle s2">✨</div><div class="splash-sparkle s3">✨</div>
    </div>
    <div class="splash-title">工作台</div>
    <div class="splash-subtitle">记录生活的每一刻小美好</div>
    <div class="splash-loader"><span></span><span></span><span></span></div>
  </div>
</div>

<!-- ============ 存钱页 ============ -->
<main class="tab-page active" id="page-money">
  <header class="page-header">
    <button class="header-back">‹</button>
    <h1>家庭记账本</h1>
    <div class="header-right"><button class="header-btn" onclick="openToolMenu()">⋯</button><button class="header-btn" onclick="showToast('个人中心')">◎</button></div>
  </header>

  <!-- 工具菜单 -->
  <div class="tool-menu" id="toolMenu">
    <button onclick="exportCSV()">📤 导出 CSV</button>
    <button onclick="importCSV()">📥 导入 CSV</button>
    <button onclick="manageMembers()">👤 成员管理</button>
  </div>

  <section class="money-summary-card">
    <div class="msc-bg-heart">♡</div>
    <div class="msc-title"><span class="msc-emoji">🏠</span><span id="summaryTitle">我们家的记账本</span><span class="msc-heart">♡</span></div>
    <div class="msc-subtitle" id="summarySub">一家人在一起的每一笔小日子</div>
    <div class="msc-stats">
      <div class="msc-stat"><div class="msc-label">总收入</div><div class="msc-value">¥<span id="totalIn">0.00</span></div></div>
      <div class="msc-stat"><div class="msc-label">总支出</div><div class="msc-value">¥<span id="totalOut">0.00</span></div></div>
      <div class="msc-stat"><div class="msc-label">结余</div><div class="msc-value">¥<span id="balance">0.00</span></div></div>
      <div class="msc-stat"><div class="msc-label">笔数</div><div class="msc-value"><span id="count">0</span></div></div>
    </div>
  </section>

  <div class="account-row">
    <button class="account-pill active" data-book="all" onclick="switchBook('all')">
      <span class="ap-emoji" style="background:#e6dcff">📔</span>总账
    </button>
    <button class="account-pill" data-book="family" onclick="switchBook('family')">
      <span class="ap-emoji" style="background:#fff3a8">🏠</span>家庭开销
    </button>
    <button class="account-pill" data-book="personal" onclick="switchBook('personal')">
      <span class="ap-emoji" style="background:#ffd6e3">👤</span>个人开支
    </button>
  </div>

  <section class="form-card">
    <div class="type-toggle">
      <button class="tt-btn active" data-type="out" onclick="switchType('out')">💸 支出</button>
      <button class="tt-btn" data-type="in" onclick="switchType('in')">💰 收入</button>
    </div>
    <div class="amount-row">
      <div class="amount-display">¥<span id="amountDisplay">0</span></div>
      <button class="clear-btn" onclick="clearAmount()">清零</button>
    </div>
    <div class="category-grid" id="categoryGrid"></div>
    <div class="meta-row">
      <div class="meta-cell note"><span>📝</span><input type="text" id="noteInput" placeholder="备注(可选)"></div>
      <div class="meta-cell date" id="dateCell" onclick="pickRecordDate()">
        <span id="dateText">2026年7月29日</span>
        <input type="date" id="recordDateInput" value="" onchange="onRecordDateChange(this.value)">
      </div>
    </div>
    <button class="save-btn" onclick="saveRecord()">✓ 记一笔</button>
  </section>

  <section class="recent-card">
    <div class="recent-header">
      <span>🌸 <span id="recentTitle">最近的小账本</span></span>
      <div class="recent-filter">
        <button class="rf-pill active" onclick="filterRecent('all')">全部</button>
        <button class="rf-pill" onclick="filterRecent('in')">收入</button>
        <button class="rf-pill" onclick="filterRecent('out')">支出</button>
      </div>
    </div>
    <div class="recent-empty" id="recentEmpty">
      <div class="recent-tulip">🌷</div><div class="recent-text">还没有记录哦</div><div class="recent-tip">快给家里记第一笔小账吧</div>
    </div>
    <ul class="recent-list" id="recentList"></ul>
  </section>
</main>

<!-- ============ 经期页 ============ -->
<main class="tab-page" id="page-period">
  <header class="page-header">
    <button class="header-back">‹</button>
    <h1 id="periodMonthTitle">2026年7月</h1>
    <div class="header-right">
      <button class="header-btn" onclick="changeMonth(-1)">◀</button>
      <button class="header-btn" onclick="goToday()">📍</button>
      <button class="header-btn" onclick="changeMonth(1)">▶</button>
    </div>
  </header>

  <div class="year-picker">
    <button class="yp-btn" onclick="changeYear(-1)">◀</button>
    <span class="yp-year" id="yearLabel">2026</span>
    <button class="yp-btn" onclick="changeYear(1)">▶</button>
  </div>

  <nav class="period-tabs">
    <button class="pt-btn active">经期</button>
    <button class="pt-btn">备孕</button>
    <button class="pt-btn">怀孕</button>
    <button class="pt-btn">育儿</button>
  </nav>

  <section class="period-hero">
    <div class="ph-content">
      <div class="ph-title" id="phTitle">未记录经期</div>
      <div class="ph-sub">预测结束日 <span id="phEndDate">--</span> ›</div>
      <button class="ph-detail-btn" onclick="showToast('查看详情')">查看详情</button>
    </div>
    <div class="ph-flower">
      <div class="ph-flower-label">今日怀孕几率</div>
      <div class="ph-flower-value" id="phChance">--</div>
    </div>
  </section>

  <section class="calendar-card">
    <div class="cal-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span><i class="dot period"></i>月经期</span>
      <span><i class="dot predict"></i>预测经期</span>
      <span><i class="dot oval"></i>排卵期</span>
      <span><i class="dot oval-day"></i>排卵日</span>
      <span class="cal-arrow">›</span>
    </div>
  </section>

  <section class="record-card">
    <div class="record-title-bar">
      <span>🌷 今日速记</span>
      <button class="edit-period-btn" onclick="editPeriodItems()">编辑</button>
    </div>
    <ul class="record-list" id="recordList"></ul>
  </section>
</main>

<!-- ============ 底部 Tab Bar ============ -->
<nav class="tab-bar">
  <button class="tab-item active" data-tab="money" onclick="switchTab('money')">
    <div class="tab-icon-wrap money-icon-circle"><span class="tab-zh">支</span></div>
    <span class="tab-label">存钱</span>
  </button>
  <button class="tab-item" data-tab="period" onclick="switchTab('period')">
    <div class="tab-icon-wrap"><span class="tab-emoji">🌷</span></div>
    <span class="tab-label">经期</span>
  </button>
</nav>

<!-- ============ 弹窗 ============ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="modalTitle">记录</span><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><button class="modal-btn save" onclick="savePeriodRecord()">保存</button></div>
  </div>
</div>

<div class="modal-overlay" id="moodOverlay" onclick="closeMoodModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="moodModalTitle">心情</span><button class="modal-close" onclick="closeMoodModal()">×</button></div>
    <div class="modal-body">
      <div class="mood-picker">
        <button class="mood-opt" data-mood="😀" onclick="selectMood('😀')">😀<span>开心</span></button>
        <button class="mood-opt" data-mood="😐" onclick="selectMood('😐')">😐<span>一般</span></button>
        <button class="mood-opt" data-mood="😨" onclick="selectMood('😨')">😨<span>焦虑</span></button>
        <button class="mood-opt" data-mood="😩" onclick="selectMood('😩')">😩<span>难过</span></button>
        <button class="mood-opt" data-mood="😣" onclick="selectMood('😣')">😣<span>很糟</span></button>
      </div>
      <div class="modal-date-row"><label>日期：</label><input type="date" id="moodDateInput"></div>
    </div>
    <div class="modal-footer"><button class="modal-btn save" onclick="saveMoodRecord()">保存</button></div>
  </div>
</div>

<div class="modal-overlay" id="dayOverlay" onclick="closeDayModal(event)">
  <div class="modal-box day-box" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="dayModalTitle">7月29日</span><button class="modal-close" onclick="closeDayModal()">×</button></div>
    <div class="modal-body"><div id="dayRecordsList"></div></div>
  </div>
</div>

<!-- 类别编辑弹窗 -->
<div class="modal-overlay" id="editOverlay" onclick="closeEditModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header"><span id="editModalTitle">编辑</span><button class="modal-close" onclick="closeEditModal()">×</button></div>
    <div class="modal-body" id="editModalBody"></div>
    <div class="modal-footer">
      <button class="modal-btn save" onclick="saveEditItem()">保存</button>
      <button class="modal-btn danger" id="editDeleteBtn" onclick="deleteEditItem()">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=2026073023"></script>
</body>
</html>
